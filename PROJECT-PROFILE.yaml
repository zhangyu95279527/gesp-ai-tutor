product:
  name: "GESP AI Tutor"
  type: "internet-product"
  stage: "discovery"

delivery:
  # 本实例采用通用迭代(不启用 Scrum 仪式); 枚举中最接近的取值为 kanban
  method: "kanban" # scrum | kanban | hybrid
  sprint_length: ""

ai:
  enabled: true
  coding_agents:
    - trae

engineering:
  source_control: git
  issue_tracker: ""
  design_tool: ""
  ci: ""
  cd: ""

architecture:
  style: "to-be-determined"
  # 分离仓布局: 交付仓 + 组件仓; 组件仓地址登记到 .agent/local/git-policy.yaml 的 notes
  repository_strategy: "multi-repo"
