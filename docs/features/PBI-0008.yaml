id: PBI-0008
type: user-story
feature_id: FEAT-002
status: in-progress
owner_role: "Developer"
title: "阶梯式引导引擎（L1/L2/L3 手动解锁）"
value: "产品核心价值'H1：引导优于直给答案'的机制落点，被讲题、诊断修正、模考讲评三处复用"
user_story:
  as_a: "做题遇阻的学生"
  i_want: "先看到思路提示，确实想不通再逐级解锁关键步骤和完整讲解"
  so_that: "我是自己想明白的，而不是抄会答案的"
# 范围：阶梯状态机（L1/L2/L3 相邻逐级）、手动解锁与留痕、级别贴合约束、考纲外会话阶梯行为、解锁动作计次触发点
# 非范围：识别与回显确认（PBI-0007）；发起讲题会话计次触发点（confirm 链路，PBI-0007 边界）；prompt 组装与模型调用契约本体（feat-002-tech-design 3.1，本 PBI 仅引用其输出边界）；追问（PBI-0009）；听懂标记与历史回看（PBI-0011）；变式题（PBI-0010）；计数规则矩阵与超限提示 UI 本体（PBI-0005）；体验模式访客承载（PBI-0012）
# UX/UI：有用户可见面，设计见 feat-002-ux-ui-design.md；是否充分在 G3 按实际输入评判。
acceptance_criteria:
  - "L1/L2 候选及同阶梯追问未通过答案边界检查前，不得出现在实时页面、断线续传或历史消息中；两次候选均违规时仅显示无答案的失败提示，当前阶梯不升级（证据：客户端实际接收内容、续传与回看回归测试）"
  # 正常路径：默认输出与逐级解锁（FR-TUT-04、BR-GUD-1/2/3）
  - "新会话确认题目后默认仅输出 L1 思路提示：只含思考方向与相关概念提示，不含实现步骤与完整代码（BR-GUD-1/2，FR-TUT-04）（证据：会话输出内容断言）"
  - "L2 输出分步解题框架（伪代码或步骤描述）不含完整可编译代码；完整参考代码与复杂度分析仅 L3 可见（BR-GUD-1/2）（证据：输出内容断言）"
  - "L2、L3 仅由用户手动点击解锁，系统不自动升级；UI 不存在定时/自动触发路径（BR-GUD-3）（证据：UI 流转测试）"
  # 阶梯边界：状态机约束（对齐 feat-002-tech-design 3.3）
  - "仅允许相邻逐级解锁：L1→L3 跳级请求被拒绝，当前阶梯状态不变（证据：接口测试）"
  - "重复解锁当前已达级别被拒绝（幂等），不产生新计数（证据：接口测试 + 计数检查）"
  # 留痕：BR-GUD-3/4 与效果度量取数源（字段口径对齐 feat-002-tech-design 5.1 session_steps）
  - "每次解锁留痕：会话标识、解锁时间、解锁后级别，落 session_steps 表（BR-GUD-3；所属用户经会话关联，不冗余落字段）（证据：数据记录检查）"
  - "用户可在会话页查看本人解锁历史（BR-GUD-4）（证据：UI 测试）"
  - "解锁留痕支持按会话聚合出解锁深度分布，供效果度量日报取数（BR-EVA 辅助信号；PBI-0019 取数源）（证据：聚合查询示例）"
  # 级别贴合（BR-LVL；level_snapshot/final_level 字段口径见 feat-002-tech-design 5.1）
  - "讲解内容仅使用回显确认级别（final_level）考纲内知识点（BR-LVL-1/3）（证据：输出抽检 + 盲评'级别贴合度'维度）"
  - "超纲解法仅允许在 L3 末尾以'拓展视野'形式出现，标注'超出本级别考纲，考试不要求'，不展开讲解（BR-LVL-2）（证据：输出内容断言）"
  - "考纲外会话（out_of_syllabus=true）走同一阶梯状态机：相邻逐级解锁与留痕规则一致，会话页持续标注'通用讲解，不针对考级'（BR-LVL-5；feat-002-tech-design 3.3）（证据：考纲外会话全流程测试）"
  # 输出合规：BR-GUD-1 的执行机制（feat-002-tech-design 3.1 输出结构化校验）
  - "L1/L2 输出在用户可见前检查：检出完整可提交代码时丢弃候选并重生成1次；仍违规只展示无答案的预置提示，记录质量事件 ladder_compliance_violation，不发布截断的违规候选（证据：客户端内容断言 + 质量事件检查）"
  # 计数与超限（触发点口径对齐 PBI-0005 与 feat-002-tech-design 4；计数矩阵本体在 PBI-0005）
  - "每次阶梯解锁（L1→L2、L2→L3）各计 1 次日限额，计数点在 unlock 动作经限额服务受理并放行时（BR-LMT-2；PBI-0005 计次时点口径）（证据：计数测试）"
  - "解锁动作超限时被拒绝并提示'今日次数已用完，明天再来'，会话状态不推进，已解锁内容可正常回看（BR-LMT-5）（证据：超限接口测试 + UI 测试）"
  - "解锁生成失败（LLM 错误）不退还当次扣减次数，重试按新请求计次（PBI-0005 计次时点口径 2026-10-23 PO 确认）（证据：故障注入测试 + 计数流水检查）"
  # 性能
  - "阶梯解锁轮流式输出首字延迟 P75 不超过 5 秒（NFR-PERF-01）（证据：性能埋点统计）"
