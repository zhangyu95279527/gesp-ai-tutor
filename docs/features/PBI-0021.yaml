title: "AI 内容安全过滤"
value: "未成年人产品的内容安全底线：输入输出双向拦截，是所有 AI 会话上线的前置"
user_story:
  as_a: "产品负责人（合规视角）"
  i_want: "AI 输入输出经内容安全检测，违规内容被拦截并留痕"
  so_that: "未成年人不会在产品中接触不当内容，且拦截可追溯"
acceptance_criteria:
