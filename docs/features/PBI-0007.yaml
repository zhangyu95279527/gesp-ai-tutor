id: PBI-0007
type: user-story
feature_id: FEAT-002
status: draft
owner_role: ""
title: "题目识别与回显确认"
value: "让学生在进入讲解前确认题目、考点与级别判定无误，避免'讲错题'级别的体验事故（R2/R3 缓解）"
user_story:
  as_a: "发起讲题的学生"
  i_want: "看到 AI 识别出的题目文本、考点和级别，确认或纠正后再进入讲解"
  so_that: "讲解内容确实针对我上传的这道题"
# 范围：识别结果回显确认、纠正留痕、同会话重识别、考纲外判定提示流转
# 非范围：题目输入采集与校验（PBI-0006）；讲解内容生成与阶梯解锁（PBI-0008）；OCR/VL 识别路由与置信度为内部实现，不向用户暴露（feat-002-tech-design 3.2）；计数规则矩阵本体（PBI-0005）
# UX/UI：有用户可见面（识别回显确认区），G3 design-ready 需配套 UX/UI 制品
acceptance_criteria:
  # 正常路径：回显确认
  - "识别结果回显包含题目文本、判定考点、判定级别三项，三项均可在回显界面直接编辑纠正；用户确认前不生成任何讲解内容，确认后才进入讲解（FR-TUT-02）（证据：UI 流转测试）"
  # 重识别：行为与计次（PO 2026-10-23 口径：第 1 次免费、第 2 次起各计 1 次，防 VL 推理成本刷取）
  - "识别回显阶段可发起同会话重新识别，重识别结果再次回显，用户确认后才进入讲解（证据：UI 流转测试）"
  - "同会话内第 1 次重识别不计入日限额，第 2 次起重识别各计 1 次（BR-LMT-3 及 2026-10-23 PO 增补口径，计数矩阵由 PBI-0005 承载）（证据：计数测试）"
  # 异常路径：识别失败
  - "识别失败（无法解析出题目文本）时，界面明确提示识别失败与可操作建议，并提供重新上传图片与改用文字输入两个重试入口（证据：失败用例 UI 测试）"
  - "识别失败的请求不产生计数（证据：计数测试）"
  # 纠正留痕（FR-TUT-02：纠正信息用于改进识别）
  - "用户在回显环节的纠正逐字段留痕：被纠正字段、原判定值、纠正值、纠正时间与所属会话（证据：数据记录检查）"
  # 边界：考纲外题目（BR-LVL-5）
  - "判定题目超出 GESP C++ 1-8 级考纲范围时，先明确提示“该题超出 GESP 考纲范围”，确认前不进入讲解；用户确认继续后按通用编程问题讲解，并在会话页持续标注“通用讲解，不针对考级”（BR-LVL-5）（证据：UI 测试）"
  # 性能
  - "题目识别 + 首轮讲解的流式输出首字延迟 P75 不超过 5 秒（NFR-PERF-01）（证据：性能埋点统计）"
dependencies: [PBI-0006]
references:
  - "docs/product/prd/03-functional-requirements.md (FR-TUT-02)"
  - "docs/product/prd/04-business-rules.md (BR-LVL, BR-LMT-3)"
  - "docs/product/prd/05-nfr.md (NFR-PERF-01)"
  - "docs/features/feat-002-tech-design.md"
