id: PBI-0007
type: user-story
feature_id: FEAT-002
status: in-progress
owner_role: "Developer"
title: "题目识别与回显确认"
value: "让学生在进入讲解前确认题目、考点与级别判定无误，避免'讲错题'级别的体验事故（R2/R3 缓解）"
user_story:
  as_a: "发起讲题的学生"
  i_want: "看到 AI 识别出的题目文本、考点和级别，确认或纠正后再进入讲解"
  so_that: "讲解内容确实针对我上传的这道题"
# 范围：识别结果回显确认、纠正留痕、同会话重识别、考纲外判定提示流转、confirm 计次触发点、识别产物落痕
# 非范围：题目输入采集与校验（PBI-0006）；讲解内容生成与阶梯解锁（PBI-0008）；OCR/VL 识别路由与置信度为内部实现，不向用户暴露（feat-002-tech-design 3.2）；计数规则矩阵本体（PBI-0005）；输入文本/图片的内容安全过滤与命中处置（PBI-0021）
# UX/UI：有用户可见面（识别回显确认区），G3 design-ready 需配套 UX/UI 制品
acceptance_criteria:
  - "用户确认的本次教学级别用于后续讲解、追问与变式，账号原级别快照保留为审计；跨日、缓存清空或服务重启均不重新赠送同会话的首次免费重识别（证据：级别差异、跨日及缓存丢失回归测试）"
  # 正常路径：回显确认
  - "识别结果回显包含题目文本、判定考点、判定级别三项，三项均可在回显界面直接编辑纠正；用户确认前不生成任何讲解内容，确认后才进入讲解（FR-TUT-02）（证据：UI 流转测试）"
  # confirm 计次触发点：创建会话与识别阶段不计数，确认提交触发首轮 L1 生成时计 1 次（feat-002-tech-design 4；计数矩阵归 PBI-0005）
  - "发起讲题计次触发点：会话创建与识别回显阶段不产生计数；用户 confirm 提交（含纠正）触发首轮 L1 生成时计 1 次（发起讲题口径），计数判定前置、超限时 confirm 被拒绝且会话状态不推进（BR-LMT-2；feat-002-tech-design 4）（证据：计数测试 + 超限拒绝接口测试）"
  # 重识别：行为与计次（PO 2026-10-23 口径：不限次数，第 1 次免费、第 2 次起各计 1 次，防 VL 推理成本刷取）
  - "识别回显阶段可发起同会话重新识别，不限次数；每次重识别结果再次回显，用户确认后才进入讲解（证据：UI 流转测试）"
  - "同会话首次放行重识别免费，第2次起预留1次，成功发布有效回显才正式计1次，失败/中断释放；首次失败不重赠免费资格（BR-LMT-3，2026-11-12用户确认，矩阵由PBI-0005承载）（证据：PG资格与预留结算测试）"
  # 异常路径：识别失败
  - "识别失败（无法解析出题目文本）时，界面明确提示识别失败与可操作建议，并提供重新上传图片与改用文字输入两个重试入口（证据：失败用例 UI 测试）"
  - "识别失败的请求不产生计数（证据：计数测试）"
  # 纠正留痕（FR-TUT-02：纠正信息用于改进识别；存储口径 questions.corrections，feat-002-tech-design 5.1）
  - "用户在回显环节的纠正逐字段留痕：被纠正字段、原判定值、纠正值、纠正时间与所属会话，落 questions.corrections（证据：数据记录检查）"
  # 识别产物落痕：A-Q6 识别命中率回归数据源（feat-002-tech-design 3.2 / 5.1）
  - "识别产物落库留痕：识别路径（text/ocr/vl）与 OCR 置信度随题目记录落库，支撑 A-Q6 识别命中率与 VL 升级率回归统计（证据：questions 表记录检查）"
  # 边界：考纲外题目（BR-LVL-5）
  - "判定题目超出 GESP C++ 1-8 级考纲范围时，先明确提示“该题超出 GESP 考纲范围”，确认前不进入讲解；用户确认继续后按通用编程问题讲解，并在会话页持续标注“通用讲解，不针对考级”（BR-LVL-5）（证据：UI 测试）"
  # 性能
  - "题目识别 + 首轮讲解的流式输出首字延迟 P75 不超过 5 秒（NFR-PERF-01）（证据：性能埋点统计）"
