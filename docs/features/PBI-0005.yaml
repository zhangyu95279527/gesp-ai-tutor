id: PBI-0005
type: user-story
feature_id: FEAT-005
status: draft
owner_role: ""
title: "日限额计数、用量展示与超限引导"
value: "O3 成本红线的执行机制：将单用户日 AI 请求约束在 15 次内，同时让用户对额度可感知"
user_story:
  as_a: "已注册学生"
  i_want: "看到当日剩余 AI 使用次数，用完时得到明确提示"
  so_that: "心里有数地安排使用，不会因突然中断而困惑"
# 范围：计数规则矩阵（计/不计/失败场景）、限额判定与 consume 进程内接口、quota_usage 计数流水、超限拒绝响应与非 AI 引导、用量展示接口与会话页指示器、限额值配置
# 非范围：计数触发动作的业务链路本体（confirm 触发点归 PBI-0007、unlock 归 PBI-0008、followup 归 PBI-0009、variant 归 PBI-0010，本 PBI 提供判定与计数服务）；访客体验额度值与防刷规则（PBI-0012；consume 接口的 user/guest owner 抽象由本 PBI 落地）；埋点事件目录契约（PBI-0019，本 PBI 按契约发射 quota_rejected）；超限引导的错题本/重练入口（P2，FEAT-008）
# UX/UI：有用户可见面（用量指示器、超限提示与引导），UX/UI 制品已入仓 feat-005-ux-ui-design.md
acceptance_criteria:
  - "同一业务请求的双击、网络重试或断线续传不重复扣次；不同请求并发时不超额放行；用户显式重新生成使用新请求并按既有规则计次（证据：并发与断连故障注入测试）"
  - "变式题生成前预留1次可用额度，成功校验并展示题面时正式计次；失败释放预留，题面展示后的首次作答不再次扣次；并发请求不能占用已预留额度（证据：额度预留/提交/释放及进程中断恢复测试）"
  # 计次口径：P0 已有入口的 5 类场景（讲题/诊断/阶梯/追问/变式）
  - "计次口径（P0 入口场景）：同一自然日内，发起讲题会话、发起错因诊断、每次阶梯解锁（L1→L2、L2→L3 各计 1 次）、每次追问、每次变式题生成与判读（合计 1 次）各计 1 次（BR-LMT-2）（证据：计数服务参数化单元测试覆盖 5 类场景）"
  # 计次口径：P1 模考讲评在 P0 无触发入口，仅验证规则注册、随 FEAT-007 上线自动生效
  - "计次口径（P1 场景注册）：计数规则表包含模考试题讲评发起计 1 次（BR-LMT-2），P0 阶段无触发入口，随 FEAT-007 上线自动生效（证据：计数规则表单元测试）"
  - "不计入项不产生计数：模考判分、错题本浏览与重练（非 AI 部分）、同会话内识别回显纠正后的第 1 次重识别（BR-LMT-3；模考判分与错题本为 P1/P2 功能，P0 验证口径注册与免费重识别场景）（证据：计数服务单元测试）"
  - "同会话重识别计次：识别回显纠正后，同会话内第 1 次重识别不计次，第 2 次起重识别各计 1 次（BR-LMT-3 增补口径，2026-10-23 PO 确认：重识别可能触发 VL 大图推理有真实成本，且防无限重识别刷取）（证据：计数服务单元测试）"
  # 失败场景计数口径：对齐 feat-002-tech-design 8 失败行为矩阵
  - "失败场景计数口径：识别失败、无效输入、输入安全命中、变式题生成或校验失败不产生计数；输出被安全截断的场景计数照计（推理成本已发生，留痕支撑申诉，FR-OPS-03）（证据：计数矩阵单元测试）"
  - "上限判定：当日累计计次达 15 次后，第 16 次 AI 请求被拒绝，返回 429 {code: quota_exhausted, reset_at: 次日 0 点}，界面提示今日次数已用完，明天再来（BR-LMT-1、BR-LMT-5；响应契约见 feat-002-tech-design 4）（证据：超限接口测试）"
  # 计数正确性：并发竞态不超放（feat-002-tech-design 9）
  - "并发竞态：计数与超限判定原子执行，同一用户并发发起多个 AI 请求时不超过当日限额放行（如并发 2 个请求仅剩 1 次额度时仅 1 个放行）（证据：Redis INCR 原子性与超限竞态测试）"
  - "计账周期：计数以 Asia/Shanghai 自然日为周期，0 点重置；跨 0 点后当日计数清零，可重新发起 AI 请求（证据：跨零点边界测试）"
  - "不中断进行中会话：会话进行中耗尽当日次数时，正在流式输出的当前一轮响应完整交付不被中断；该轮完成后，会话内新 AI 请求（阶梯解锁、追问、变式题生成）按超限拒绝，已生成内容可正常回看（BR-LMT-5）（证据：会话内超限边界的接口与 UI 测试）"
  # BR-LMT-5 引导目标中错题本/重练为 P2 功能，P0 仅落历史会话入口（2026-10-23 PO 确认）
  - "超限引导：超限提示同时提供非 AI 功能引导，P0 引导至回看历史会话；浏览错题本与重练入口随 P2（FEAT-008）上线后补充（BR-LMT-5，P0 裁剪口径 2026-10-23 PO 确认）（证据：UI 检查）"
  # 会话页由 PBI-0007/0008 交付，本条的 G4 集成验证随会话页落地完成
  - "用量展示：会话页常驻显示当日可用次数（可用=限额值-当日已用-有效预留），预留处理中与正式扣次区分显示，每次结算后刷新；集成验证随PBI-0007完成（FR-LMT-02）（证据：UI检查）"
  # 计数流水与事件：PBI-0019 触顶率/触顶次日留存指标的数据源（feat-002-tech-design 5.2 / 6.3）
  - "计数流水：每次计次与每次超限拒绝写 quota_usage 流水（动作类型、会话引用、时间、是否拒绝），支撑限额触顶率与触顶用户次日留存日报取数（PBI-0019 数据源）（证据：流水记录检查）"
  - "超限拒绝事件：每次超限拒绝按事件目录契约发射 quota_rejected 事件（携带动作类型），入 events 表供日报聚合（PBI-0019 目录契约）（证据：事件记录检查）"
  # 以下两条为 refinement 增补口径（2026-10-23 PO 确认）
  - "限额值可配置：日限额默认 15 次，支持不发布版本的配置调整，调整即时生效于新请求的超限判定、不回溯当日已计次数（对齐 06-mvp-scope O3 回审预案与 PBI-0012 体验额度配置先例；2026-10-23 PO 确认）（证据：配置调整演练记录）"
  - "计次时点：AI 请求经限额服务受理并放行时计 1 次；放行后模型调用失败或中断不退还次数，重试按新请求计次（2026-10-23 PO 确认）（证据：故障注入测试）"
  - "不提供任何付费加次入口（BR-LMT-5，本期无付费）（证据：UI 检查）"
