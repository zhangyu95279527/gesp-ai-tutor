  - "列表可按考点、级别、来源筛选（FR-WBK-03）（证据：UI 筛选测试）"
  - "用户可手动移除已归集错题（证据：UI 测试）"
  - "错题本浏览与重练（非 AI 部分）不计入日限额（BR-LMT-3）（证据：计数测试）"
