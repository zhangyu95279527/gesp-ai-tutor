title: "真题题库建设与测试数据校准（首批级别段）"
value: "P1 上线量纲的题库资产：判分可信是模考产品成立的前提，不以凑数降低测试数据质量"
user_story:
  as_a: ""
  i_want: ""
  so_that: ""
acceptance_criteria:
  - "首批级别段每级别不少于 2 套 GESP 历届真题入库且全部测试数据校准完成，总数不少于 8 套（建议 3-6 级，以 00-overview Q1 最终确认为准）（证据：题库清单与套卷清点）"
  - "每题测试数据按 O7 方案构建：公开渠道收集 + 按题意自命边界数据；官方公开样例判分一致率 100% 为强制门槛；自命数据须经双人交叉验证（第二人独立按题意复核数据正确性）（证据：抽检比对记录 + 交叉验证记录）"
  - "模考判分在产品文案中声明为参考标准：明示测试数据为自建校准数据、与官方评测环境可能存在差异，不承诺与官方判分完全一致（BR-CPY 风险声明）（证据：页面文案检查）"
  - "每题标注来源（GESP 历届真题，CCF 主办）与考点/级别映射；免费使用、不售卖、不打水印改写（BR-CPY）（证据：题库字段与文案检查）"
  - "题库具备 48 小时内下线指定题目的操作能力（BR-CPY-3 权利方异议预案）（证据：下线操作的演练记录）"
