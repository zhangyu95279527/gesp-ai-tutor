id: PBI-0020
type: user-story
feature_id: FEAT-006
status: draft
owner_role: ""
title: "盲评抽样导出与结果录入"
value: "金标准之二'教练盲评均分 ≥3.5/5'的执行工具（O4），同时支撑变式题难度校准（BR-VAR-2）"
user_story:
  as_a: "产品负责人"
  i_want: "按分层抽样规则导出讲解会话给教练盲评，并录入评分结果"
  so_that: "用人工金标准校准 AI 讲解质量"
# 范围：盲评抽样 CLI（iteration / daily 两模式）、导出上下文白名单快照、Langfuse 标注队列对接、评分回写 sync、仲裁与终值视图（blind_eval_final）、结果入日报供数
# 非范围：日报看板与逐指标取数口径本体（PBI-0019，本 PBI 仅向其供数）；变式题生成与判读（PBI-0010）；教练账号管理（Langfuse 邀请制，基线身份/安全节既定，不自建评分 UI）；变式题 prompt 回炉动作（BR-VAR-2 的业务决策，本 PBI 仅产出偏易占比信号）
# UX/UI：无用户可见面；运营面为 Langfuse 标注队列（工具自带 UI）与 CLI，无自研 UI——G3 design-ready 不适用
acceptance_criteria:
  - "盲评抽样包含未标听懂、未做变式的已完成L1会话；无变式仅将变式组记不适用，不排除讲解评分；报告候选、抽样、有效评分与待仲裁数量（证据：含未完成变式的分层抽样与日报测试）"
  - "同一教练评分同步重试不重复计票；分差超过1分的维度在第三人仲裁前不计入终值；判读正确性抽检保留异议与复核结果（证据：重复同步、评分修订、仲裁等待和判读抽检记录）"
  # 正常路径：分层抽样导出（BR-EVA-2、NFR-REL-03；feat-006-tech-design 3.3）
  - "重大迭代（提示词/模型变更、新模块上线）后抽样导出 30 个已完成会话：按级别段（1-4 / 5-8）× 模块（讲题 / 诊断）四层分层随机，每层至少 6 个，余量由各层按比例补齐至 30（BR-EVA-2）（证据：导出清单核对 + 分层抽样单测）"
  - "上线初期每日随机抽 10 个会话供人工检视，与迭代抽样同一 CLI 入口（--mode daily），持续至盲评机制稳定（NFR-REL-03）（证据：日抽样导出清单）"
  - "抽样候选集为存在 L1 讲解消息且自上次同模式抽样后创建的会话；同一会话不重复入同一模式批次（feat-006-tech-design 3.3）（证据：候选集与去重单测）"
  # 边界：分层不足与重跑
  - "某分层候选不足 6 个时该层全取，并在批次元数据记 shortfall 标记，不阻塞批次（feat-006-tech-design 3.3）（证据：shortfall 在导出清单可见）"
  - "抽样导出幂等：同 iteration_tag 重跑跳过已入队会话；Langfuse 不可用时 CLI 报错退出可安全重跑（feat-006-tech-design 8）（证据：重跑一致性测试）"
  # 导出内容与字段审计（未成年人数据保护；feat-006-tech-design 5.2 / 7 / 9）
  - "导出包含题面与考点、本次最终教学级别及账号级别快照、解锁留痕、逐轮消息、变式与首次作答/判读状态；足以独立复核级别贴合及判读正误（证据：导出字段与复核样例检查）"
  - "导出仅含白名单字段：明确不含邮箱、昵称、出生年月、设备指纹、IP、oss_key 原文；白名单键集合与身份字段黑名单双向断言由审计测试强制，防后续迭代混入身份字段（feat-006-tech-design 5.2 / 9）（证据：审计测试执行记录）"
  - "导出访问受控：教练经 Langfuse 邀请制账号评分，样本落库记录 exported_by 操作留痕可审计（feat-006-tech-design 7）（证据：访问权限检查 + 操作留痕记录）"
  # 评分录入与仲裁（BR-EVA-3/4、BR-VAR-2；feat-006-tech-design 3.3 / 5.2）
  - "评分按两组独立计分、互不污染归因：引导效果组（引导性/正确性/级别贴合度/表达与安全，各 1-5 分）与变式题质量组（相当/偏易/偏难三档）（BR-EVA-3、BR-VAR-2）（证据：录入数据结构检查）"
  - "每组 2 名教练独立评分；引导效果组单维度分差 >1 由第三人复评、终值取三人中位数并标 arbitrated；变式题质量组档位不一致由第三人裁定取多数档（BR-EVA-4；终值规则建议见 feat-006-tech-design 10-D1，待 PO 确认、非阻塞）（证据：仲裁单测 + blind_eval_final 视图用例）"
  - "讲解组与变式组独立计算终值和覆盖；无变式的讲解样本仍可进入讲解均分，变式组记不适用；缺评分或待仲裁维度不进入终值并单列数量（证据：视图边界与覆盖率测试）"
  - "金标准'盲评均分 ≥3.5/5'口径 = 引导效果组四子维度全样本均值；变式题'偏易'占比入日报，>20% 时触发 BR-VAR-2 回炉评估（BR-EVA-1、BR-VAR-2）（证据：日报 panel 核对）"
  # 结果回写
  - "评分回写经 Langfuse API 拉取并按 synced_at 增量；sync 连续失败按 P3 告警（feat-006-tech-design 8）（证据：sync 重试测试 + 告警规则检查）"
